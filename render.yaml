services:
  # VAARIS Backend (NestJS + Prisma API)
  - type: web
    name: vaaris-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vaaris-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'

  # VAARIS Frontend (React 19 + Vite SPA)
  - type: web
    name: vaaris-frontend
    env: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: vaaris-db
    plan: free
    databaseName: vaaris_db
    postgresMajorVersion: '16'
